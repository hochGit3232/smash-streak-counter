<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>連勝カウンター</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex; align-items: center; justify-content: flex-start;
    height: 100vh; padding-left: 16px;
  }
  .box {
    padding: 8px 24px 10px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(20,20,30,.85), rgba(60,20,20,.85));
    border: 3px solid #f4c430;
    color: #fff; text-shadow: 0 2px 4px #000;
  }
  .main { display: flex; align-items: baseline; gap: 8px; }
  .num { font-size: 72px; font-weight: 900; color: #ffd84a; line-height: 1; }
  .unit { font-size: 32px; font-weight: 800; }
  .best { font-size: 18px; opacity: .8; margin-left: 12px; }
  .recent { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .recent .w { color: #ffd84a; }
  .recent .l { color: #8fb8ff; }
  .recent .rate { opacity: .8; font-size: 16px; margin-left: 6px; }
  .marks { display: flex; gap: 3px; margin-top: 6px; }
  .marks i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: 0 1px 2px #000; }
  .marks .W { background: #ffd84a; }
  .marks .L { background: #4a6fa8; }
  .pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="box">
  <div class="main">
    <span class="num" id="num">0</span><span class="unit">連勝</span>
    <span class="best">最高 <span id="best">0</span></span>
  </div>
  <div class="recent" id="recent"></div>
  <div class="marks" id="marks"></div>
</div>
<script>
let last = null;
async function tick() {
  try {
    const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
    const num = document.getElementById('num');
    if (s.streak !== last) {
      num.textContent = s.streak;
      num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
      last = s.streak;
    }
    document.getElementById('best').textContent = s.best;
    const r = s.recent;
    document.getElementById('recent').innerHTML = r.games
      ? `直近${r.games}戦 <span class="w">${r.wins}勝</span> <span class="l">${r.losses}敗</span>` +
        `<span class="rate">勝率${Math.round(r.wins / r.games * 100)}%</span>`
      : '直近の戦績 なし';
    document.getElementById('marks').innerHTML = [...s.marks].map(m => `<i class="${m}"></i>`).join('');
  } catch (e) {}
}
tick(); setInterval(tick, 500);
</script>
</body>
</html>
